services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mrp
      POSTGRES_PASSWORD: mrp
      POSTGRES_DB: mrp
    ports: ["5432:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrp"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]

  mc:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin) do sleep 2; done;
      /usr/bin/mc mb -p local/mrp-renders || true; exit 0;"

  grafana:
    image: grafana/grafana:11.0.0
    ports: ["3000:3000"]
    environment: { GF_SECURITY_ADMIN_PASSWORD: admin }
    volumes:
      - "grafana:/var/lib/grafana"
      - "./grafana/provisioning:/etc/grafana/provisioning"
      - "./grafana/dashboards:/var/lib/grafana/dashboards"

  airflow-init:
    build: { context: ., dockerfile: infra/docker/Dockerfile }
    depends_on: [postgres]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mrp:mrp@postgres:5432/mrp
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --password admin
               --firstname A --lastname D --role Admin --email a@example.com"
    volumes:
      - "./dags:/opt/airflow/dags"
      - "./src:/opt/airflow/src"
      - "./dbt:/opt/airflow/dbt"
      - "./data_quality:/opt/airflow/data_quality"

  airflow-webserver:
    build: { context: ., dockerfile: infra/docker/Dockerfile }
    depends_on: [airflow-init]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mrp:mrp@postgres:5432/mrp
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      POSTGRES_DSN: postgresql://mrp:mrp@postgres:5432/mrp
      USE_S3: "true"
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: mrp-renders
    command: webserver
    ports: ["8080:8080"]
    volumes:
      - "./dags:/opt/airflow/dags"
      - "./src:/opt/airflow/src"
      - "./dbt:/opt/airflow/dbt"
      - "./data_quality:/opt/airflow/data_quality"

  airflow-scheduler:
    build: { context: ., dockerfile: infra/docker/Dockerfile }
    depends_on: [airflow-init]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mrp:mrp@postgres:5432/mrp
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      POSTGRES_DSN: postgresql://mrp:mrp@postgres:5432/mrp
      USE_S3: "true"
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: mrp-renders
    command: scheduler
    volumes:
      - "./dags:/opt/airflow/dags"
      - "./src:/opt/airflow/src"
      - "./dbt:/opt/airflow/dbt"
      - "./data_quality:/opt/airflow/data_quality"

volumes: { pg: {}, minio: {}, grafana: {} }
