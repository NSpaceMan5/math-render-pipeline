[project]
name = "math-render-pipeline"
version = "0.1.0"
description = "Deterministic mathematical image generation pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pillow>=10.0", "pydantic>=2.6",
  "pydantic-settings>=2.2", "pyarrow>=15.0",
  "typer>=0.12", "pandas>=2.2",
]

[project.optional-dependencies]
dev      = ["pytest>=8.0", "ruff>=0.4", "hypothesis>=6.100"]
postgres  = ["psycopg[binary]>=3.1"]
streaming = ["confluent-kafka>=2.3"]
migrations = ["alembic>=1.13", "sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
dq         = ["great-expectations>=0.18,<1.0"]
integration = ["testcontainers[postgres,kafka]>=4.0", "docker>=7.0"]
observability = [
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-grpc>=1.25",
]

[project.scripts]
mrp = "mrp.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/mrp/cli.py" = ["B008"]
"tests/*" = ["B008"]

[tool.pytest.ini_options]
markers = [
  "integration: tests requiring Docker (testcontainers)",
]
addopts = "-m 'not integration'"
