name: ci

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,streaming,migrations,dq,observability]"

      - name: Lint
        run: ruff check src tests

      - name: Prepare workspace
        run: mkdir -p data

      - name: Alembic upgrade (fresh sqlite)
        env:
          POSTGRES_DSN: sqlite:///./data/ci_alembic.sqlite
        run: |
          alembic upgrade head
          alembic current

      - name: Unit tests
        env:
          POSTGRES_DSN: sqlite:///./data/mrp.sqlite
          USE_S3: "false"
        run: pytest -q -o addopts="" -m "not integration"

      - name: Smoke render
        env:
          POSTGRES_DSN: sqlite:///./data/mrp.sqlite
          USE_S3: "false"
        run: |
          mrp run --formula polar_loom --width 320 --height 240 \
            --params '{"rings":12,"twist":2.0,"decay":2.0,"fold":1.0}'

  integration:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,streaming,integration,observability]"

      - name: Prepare workspace
        run: mkdir -p data

      - name: Integration tests (Docker via testcontainers)
        env:
          USE_S3: "false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: pytest -q -o addopts="" -m integration tests/integration -v
